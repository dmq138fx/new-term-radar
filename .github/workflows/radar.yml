name: New-term radar

# Two schedules, one state:
#   sources  every 8 hours: X and Hugging Face, where a name is said first. Posts a
#            report only when there is a new name.
#   daily    once a day: everything else, the review of leads from 14 days ago, and the
#            source leads of the last day.
#
# Off until you opt in: set the repository variable RADAR_ENABLED to "true"
# (Settings > Secrets and variables > Actions > Variables), add the secret AISA_API_KEY,
# and commit your config.json (remove it from .gitignore first; it holds no secrets).
# Optional secrets: RESEND_API_KEY, EMAIL_FROM, RADAR_EMAIL_TO (mail the reports),
# GSC_TOKEN_JSON (the Search Console signal).
#
on:
  schedule:
    - cron: "0 0,8,16 * * *"   # sources
    - cron: "30 1 * * *"       # daily
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [daily, sources, initialize, initialize-toolify]
        description: "Initialization is manual only"
        default: "daily"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: github.ref == 'refs/heads/main' && (vars.RADAR_ENABLED == 'true' || github.event.inputs.command == 'initialize' || github.event.inputs.command == 'initialize-toolify')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '30 1 * * *' && 'daily' || 'sources') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Validate configuration
        env:
          GH_TOKEN: ${{ secrets.RADAR_STATE_TOKEN }}
          STATE_REPO: ${{ vars.RADAR_STATE_REPOSITORY }}
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TOOLIFY: ${{ vars.TOOLIFY_ENABLED }}
          AISA: ${{ secrets.AISA_API_KEY }}
        run: |
          python -m json.tool config.json >/dev/null
          test -n "$AISA" || [[ "$COMMAND" == initialize* ]]
          test -n "$STATE_REPO" && test -n "$GH_TOKEN"
          test "$(gh repo view "$STATE_REPO" --json visibility --jq .visibility)" = PRIVATE
          if [[ -n "$BOT" || -n "$CHAT" ]]; then
            test -n "$BOT" && test -n "$CHAT" || exit 1
            echo "QUEUE=--queue" >> "$GITHUB_ENV"
          fi
          if [[ "$COMMAND" == initialize-toolify ]]; then test "$ENABLE_TOOLIFY" = true; fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.RADAR_STATE_REPOSITORY }}
          token: ${{ secrets.RADAR_STATE_TOKEN }}
          ref: main
          path: authority
          fetch-depth: 0
          filter: blob:none

      - name: Restore verified state
        run: |
          operation=restore
          if [[ "$COMMAND" == initialize ]]; then operation=initialize; fi
          python -m radar.checkpoint "$operation"

      - name: Run the radar
        if: env.COMMAND == 'sources' || env.COMMAND == 'daily'
        timeout-minutes: 22
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          if [ "$COMMAND" = "daily" ]; then
            python -m radar daily --skip x,hf --out report.md ${RADAR_EMAIL_TO:+--mail}
          else
            python -m radar sources --out report.md ${RADAR_EMAIL_TO:+--mail}
          fi
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Discover Toolify products
        if: env.COMMAND != 'sources' && vars.TOOLIFY_ENABLED == 'true'
        timeout-minutes: 15
        run: |
          init=""
          if [[ "$COMMAND" == initialize* ]]; then init=--initialize; fi
          python -m radar.toolify --config config.json $init ${QUEUE:-}

      - name: Initialize empty radar database
        if: env.COMMAND == 'initialize' && vars.TOOLIFY_ENABLED != 'true'
        run: python -c "from radar.store import connect; from pathlib import Path; connect(Path('state')).close()"

      - name: Publish verified state
        timeout-minutes: 5
        run: python -m radar.checkpoint publish

      - name: Deliver queued summaries
        timeout-minutes: 8
        if: env.COMMAND == 'daily' && vars.TOOLIFY_ENABLED == 'true' && env.QUEUE == '--queue'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m radar.toolify --config config.json --deliver --authority authority

      - name: Keep diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ env.COMMAND }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report.md
            report.json
            toolify.json
          if-no-files-found: ignore
          retention-days: 30
